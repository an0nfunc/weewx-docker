name: Build

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Weekly rebuild so published images pick up Alpine security updates.
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lint shell scripts
        run: shellcheck docker-entrypoint.sh tests/smoke.sh

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=moby/buildkit:v0.35.1@sha256:baf6138eb8c37644800c7c913fba051e840ebb9ba13eaf92d92ef9a1712d0b4c

      # Outside pull requests the cache is skipped, so main tests the same
      # package set that the publish job installs.
      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: weewx:test
          no-cache: ${{ github.event_name != 'pull_request' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Check Alpine packages are current
        if: github.event_name != 'pull_request'
        run: |
          outdated=$(docker run --rm --user 0 weewx:test sh -c 'apk update -q >/dev/null && apk version -q -l "<"')
          if [ -n "$outdated" ]; then
            echo "$outdated"
            exit 1
          fi

      - name: Smoke test
        run: tests/smoke.sh weewx:test

  publish:
    if: github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read weewx version
        id: weewx
        run: echo "version=$(sed -n 's/^weewx==\([^ ]*\).*/\1/p' requirements.txt)" >> "$GITHUB_OUTPUT"

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ghcr.io/${{ github.repository_owner }}/weewx
          flavor: latest=false
          tags: |
            type=pep440,pattern={{version}},value=${{ steps.weewx.outputs.version }}
            type=pep440,pattern={{major}}.{{minor}},value=${{ steps.weewx.outputs.version }}
            type=pep440,pattern={{major}},value=${{ steps.weewx.outputs.version }}
            type=raw,value=latest
            type=sha
          # Without its own input, annotations default to the repository's MIT license.
          labels: |
            org.opencontainers.image.title=weewx
            org.opencontainers.image.description=WeeWX weather station software on Alpine, with rtl_433
            org.opencontainers.image.licenses=GPL-3.0-only AND GPL-2.0-or-later
          annotations: |
            org.opencontainers.image.title=weewx
            org.opencontainers.image.description=WeeWX weather station software on Alpine, with rtl_433
            org.opencontainers.image.licenses=GPL-3.0-only AND GPL-2.0-or-later

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          image: docker.io/tonistiigi/binfmt:qemu-v10.2.3@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
          platforms: arm64,arm

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=moby/buildkit:v0.35.1@sha256:baf6138eb8c37644800c7c913fba051e840ebb9ba13eaf92d92ef9a1712d0b4c

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          provenance: mode=max
          attests: type=sbom,generator=docker.io/docker/buildkit-syft-scanner:1.12.1@sha256:873a7458c3c8ac8e32c7b796c10e1600b07b963d2aa000a72a2d97aaaa2d6315

      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/weewx
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
          # Storage records exist only for organization-owned repositories.
          create-storage-record: false

      - name: Verify the attestation
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: oci://ghcr.io/${{ github.repository_owner }}/weewx@${{ steps.build.outputs.digest }}
        # The same policy as the README, pinned to this commit.
        run: |
          identity="https://github.com/$GITHUB_REPOSITORY/.github/workflows/build.yaml@refs/heads/main"
          policy=(--repo "$GITHUB_REPOSITORY" --cert-identity "$identity" --source-digest "$GITHUB_SHA")
          gh attestation verify "$IMAGE" "${policy[@]}"
          gh attestation verify "$IMAGE" "${policy[@]}" --bundle-from-oci
